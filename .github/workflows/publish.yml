name: Publish

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 26.x

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.x

      - name: Install dependencies
        run: npm ci

      - name: Check for skip lerna in commit message
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MESSAGE"

          if [[ "$COMMIT_MESSAGE" == *"[skip lerna]"* ]]; then
            echo "SKIP_LERNA=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_LERNA=false" >> "$GITHUB_ENV"
          fi

      - name: Configure Git
        if: env.SKIP_LERNA == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages
        if: env.SKIP_LERNA == 'false'
        run: npm exec -- lerna version --yes

      - name: Publish packages
        if: env.SKIP_LERNA == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm exec -- lerna publish from-package --yes
