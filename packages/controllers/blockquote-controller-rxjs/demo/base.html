<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="description" content="Demo Base - blockquote-controller-rxjs" />
    <title>Base - blockquote-controller-rxjs</title>
    <style>
      :root {
        font: normal medium/1.25 sans-serif;
      }

      [data-embedded] .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      body {
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sr-only">blockquote-controller-rxjs-demo</h1>
      <blockquote-controller-rxjs-demo></blockquote-controller-rxjs-demo>
    </main>
    <script type="module">
      import {html, LitElement, map, fromEventPattern, BlockquoteControllerRxjs} from './entry.js';

      const mousemove$ = fromEventPattern(
        (handler) => {
          window.addEventListener('mousemove', handler);
        },
        (handler) => {
          window.removeEventListener('mousemove', handler);
        }
      );

      class BlockquoteControllerRxjsDemo extends LitElement {
        pos = new BlockquoteControllerRxjs(this, {
          stream$: mousemove$[map](({clientX, clientY}) => ({
            x: clientX,
            y: clientY,
          })),
          initialValue: {x: 0, y: 0},
          callback: (value) => {
            console.info('mouse position', value);
          },
        });

        render() {
          const {x, y} = this.pos.value;
          return html`
            <p>The mouse is at:</p>
            <pre>
              x: ${x}
              y: ${y}
            </pre>
          `;
        }
      }

      window.customElements.define('blockquote-controller-rxjs-demo', BlockquoteControllerRxjsDemo);
    </script>
  </body>
</html>
